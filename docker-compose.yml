# The whole local backend in one container — `make backend-up` / `make backend-down`, or `make local`, which uses it.
services:
  backend:
    build: .
    container_name: agrisahaya-backend
    init: true
    # SETTING_* business settings (functions/src/shared/settings.ts): .env first, then .env.pulled — the production
    # values copied down by `make settings-pull` / `make local-apks` — which wins where both set one. The functions
    # read them from this environment and docker/seed-settings.cjs copies them into the local config/app for the apps.
    # A changed file applies on the next `make backend-restart` (compose recreates the container when it differs).
    # functions/.env.local (the local auth header) is loaded by the emulator itself.
    env_file:
      - path: .env
        required: false
      - path: .env.pulled
        required: false
    ports:
      - "4000:4000" # Emulator UI
      - "4400:4400" # Emulator hub
      - "4500:4500" # Emulator logging (UI log viewer)
      - "9150:9150" # Firestore websocket (UI)
      - "5001:5001" # Functions
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
    volumes:
      - .:/workspace
      # Linux-built dependencies kept apart from the Mac's functions/node_modules.
      - functions_node_modules:/workspace/functions/node_modules
    # The emulators save emulator-data/ on SIGINT; give the export time to finish.
    stop_signal: SIGINT
    stop_grace_period: 60s
    healthcheck:
      # Healthy once Firestore, Auth and Functions all answer — not just the hub, which starts first — and the
      # settings are in the local config/app (docker/backend.sh), so an app launched right after reads the right ones.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080 && curl -fs http://127.0.0.1:9099 && curl -s -o /dev/null http://127.0.0.1:5001 && test -f /tmp/settings-seeded"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

volumes:
  functions_node_modules:
